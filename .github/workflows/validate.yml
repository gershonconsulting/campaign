name: Validate Campaign
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check server functions (no live provider calls)
        run: deno check supabase/functions/campaign-api/index.ts supabase/functions/linkedin-connect/index.ts supabase/functions/linkedin-status/index.ts supabase/functions/campaign-planner/index.ts supabase/functions/campaign-worker/index.ts
      - name: Test scheduler authentication and dry-run guard (mock HTTP only)
        run: deno test --allow-env supabase/functions/_tests/engine_test.ts
      - name: Reject legacy provider adapter
        run: |
          if grep -REn 'api/v1|UNIPILE_DSN|hosted/accounts/link|_shared/provider' supabase/functions; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-preview
          path: dist
  engine-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: campaign_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run actual PostgreSQL migration and concurrent-worker tests
        run: node --experimental-transform-types --test tests/engine-db.test.ts
        env:
          CAMPAIGN_TEST_DATABASE_URL: postgres://postgres:isolated-test-password@localhost:5432/campaign_test

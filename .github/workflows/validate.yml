name: Validate Campaign
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check server functions (no live provider calls)
        run: deno check supabase/functions/campaign-api/index.ts supabase/functions/linkedin-connect/index.ts supabase/functions/linkedin-status/index.ts
      - name: Reject legacy provider adapter
        run: |
          if grep -REn 'api/v1|UNIPILE_DSN|hosted/accounts/link|_shared/provider' supabase/functions; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-preview
          path: dist
